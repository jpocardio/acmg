<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clasificador ACMG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra fija con resultado y texto para copiar; debajo, rejilla de 4 columnas como la hoja (población · tipo de variante · funcional/predictores · resumen). */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --fg:#1d2420; --muted:#66706a; --line:#dde2dd; --accent:#2d6a4f;
  --vs:#4f9a3a; --vs-fg:#ffffff; --st:#9fcf86; --st-fg:#11300a; --mo:#f3dc84; --mo-fg:#3d3000; --su:#f2b9b9; --su-fg:#4a1010;
  --bsa:#4a4f55; --bsa-fg:#ffffff; --bst:#8e959c; --bst-fg:#ffffff; --bmo:#b9bfc5; --bmo-fg:#1b1f23; --bsu:#dde1e5; --bsu-fg:#1b1f23;
  --warn:#9a5b00; --warn-bg:#fff4dc; --bad:#a3262a; --off:#c9cec9;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-code:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1a201d; --fg:#e4e9e5; --muted:#97a19b; --line:#2c3531; --accent:#74c69d;
  --vs:#3f8a2c; --vs-fg:#ffffff; --st:#5f9a48; --st-fg:#0b1a06; --mo:#b99a2c; --mo-fg:#1c1500; --su:#b46a6a; --su-fg:#1f0606;
  --bsa:#d5d9dd; --bsa-fg:#111; --bst:#9aa1a8; --bst-fg:#111; --bmo:#6b737b; --bmo-fg:#fff; --bsu:#454c53; --bsu-fg:#fff;
  --warn:#f0b75a; --warn-bg:#2d2412; --bad:#ff7b7f; --off:#39423d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1a201d; --fg:#e4e9e5; --muted:#97a19b; --line:#2c3531; --accent:#74c69d;
  --vs:#3f8a2c; --vs-fg:#ffffff; --st:#5f9a48; --st-fg:#0b1a06; --mo:#b99a2c; --mo-fg:#1c1500; --su:#b46a6a; --su-fg:#1f0606;
  --bsa:#d5d9dd; --bsa-fg:#111; --bst:#9aa1a8; --bst-fg:#111; --bmo:#6b737b; --bmo-fg:#fff; --bsu:#454c53; --bsu-fg:#fff;
  --warn:#f0b75a; --warn-bg:#2d2412; --bad:#ff7b7f; --off:#39423d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:13px/1.35 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-weight:700;font-size:14px;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);font-size:11px;margin-left:4px}
.result{display:flex;align-items:center;gap:8px;min-width:0}
.cls{font:700 15px var(--f-body);padding:3px 10px;border-radius:4px;white-space:nowrap;background:var(--off);color:var(--fg)}
.cls[data-c="P"]{background:var(--bad);color:#fff}
.cls[data-c="LP"]{background:#d9822b;color:#fff}
.cls[data-c="HVUS"]{background:var(--mo);color:var(--mo-fg)}
.cls[data-c="VUS"]{background:var(--off);color:var(--fg)}
.cls[data-c="LB"]{background:var(--bmo);color:var(--bmo-fg)}
.cls[data-c="B"]{background:var(--bsa);color:var(--bsa-fg)}
.pts{font:600 11.5px var(--f-body);color:var(--muted);min-width:0}
.outs{display:flex;flex-direction:column;gap:3px;flex:1 1 420px;min-width:0}
.out{display:flex;gap:6px;align-items:center;min-width:0}
.out input{flex:1;min-width:0;font:600 13px var(--f-code);padding:4px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.out.long input{font-weight:500;font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.quick{display:flex;gap:6px;align-items:center;flex:1 1 300px;min-width:0}
.quick input{flex:1;min-width:0;font:12px var(--f-code);padding:4px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.quick input.err{border-color:var(--bad)}
.varin{flex:1 1 300px;min-width:0;font:12px var(--f-body);padding:4px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px;align-items:start}
@media (max-width:1250px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px 7px}
.blk h3{margin:0 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.blk h4{margin:6px 0 2px;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.crit{display:grid;grid-template-columns:62px minmax(0,1fr) auto 18px;gap:4px;align-items:center;padding:2px 0;border-top:1px dashed transparent}
.crit + .crit{border-top-color:var(--line)}
.code{font:700 11.5px var(--f-code);text-align:left;background:none;border:0;padding:2px 0;cursor:pointer;white-space:nowrap}
.code.b{color:var(--muted)}
.lbl{font-size:11.5px;color:var(--fg);min-width:0}
.crit.nr .code,.crit.nr .lbl{opacity:.55}
.crit.nr .lbl::after{content:var(--nr-txt," · no rec. cardio");font-size:10px;color:var(--muted)}
.seg{display:inline-flex}
.seg .btn{border-radius:0;padding:3px 6px}
.seg .btn:first-child{border-radius:4px 0 0 4px}
.seg .btn:last-child{border-radius:0 4px 4px 0;margin-left:-1px}
.crit.blocked .lbl{text-decoration:line-through;text-decoration-color:var(--muted)}
.chips{display:flex;gap:2px}
.chip{font:600 10.5px var(--f-code);min-width:30px;padding:2px 3px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--muted);cursor:pointer}
.chip.def{border-color:var(--muted);color:var(--fg)}
.chip.nr{border-style:dashed}
.chip:disabled{cursor:not-allowed;opacity:.35}
.chip.sel[data-l="VS"]{background:var(--vs);color:var(--vs-fg);border-color:var(--vs)}
.chip.sel[data-l="S"]{background:var(--st);color:var(--st-fg);border-color:var(--st)}
.chip.sel[data-l="M"]{background:var(--mo);color:var(--mo-fg);border-color:var(--mo)}
.chip.sel[data-l="P"]{background:var(--su);color:var(--su-fg);border-color:var(--su)}
.chip.b.sel[data-l="SA"]{background:var(--bsa);color:var(--bsa-fg);border-color:var(--bsa)}
.chip.b.sel[data-l="S"]{background:var(--bst);color:var(--bst-fg);border-color:var(--bst)}
.chip.b.sel[data-l="M"]{background:var(--bmo);color:var(--bmo-fg);border-color:var(--bmo)}
.chip.b.sel[data-l="P"]{background:var(--bsu);color:var(--bsu-fg);border-color:var(--bsu)}
.crit.auto .code::after{content:"•";color:var(--accent);margin-left:2px}
.info{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:none;font-size:10.5px;line-height:1;cursor:pointer;color:var(--muted);padding:0}
.info:hover{border-color:var(--accent);color:var(--accent)}
.guide{display:none;grid-column:1/-1;font-size:11px;color:var(--muted);padding:0 0 2px 0}
body.g .guide{display:block}
.tally{font:12px var(--f-code);display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr)) auto;gap:2px 6px;align-items:center}
.tally .h{color:var(--muted);font-size:10.5px}
.tally .tot{font-weight:700;text-align:right}
.scale{display:flex;height:20px;border-radius:3px;overflow:hidden;position:relative;margin:8px 0 2px;font:600 10px var(--f-code)}
.scale span{display:flex;align-items:center;justify-content:center;color:var(--fg)}
.scale .mk{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--fg);border-radius:2px;transition:left .15s}
@media (prefers-reduced-motion:reduce){.scale .mk{transition:none}}
.scale-n{display:flex;justify-content:space-between;font:10px var(--f-code);color:var(--muted)}
.warns{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.warns li{font-size:11.5px;background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:3px 6px}
.warns li.bad{color:var(--bad)}
.detail{font-size:12px;line-height:1.45}
.detail b.c{font-family:var(--f-code)}
.detail p{margin:4px 0}
.detail .meta{color:var(--muted);font-size:11px}
.hint{font-size:11px;color:var(--muted)}
.refs{font-size:10.5px;color:var(--muted);line-height:1.4}
kbd{font:10px var(--f-code);border:1px solid var(--line);border-radius:3px;padding:0 3px}
.flash{color:var(--bad);font-size:11px;min-height:14px}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="brand">ACMG<small>Richards 2015 + SVI · cardio</small></div>
  <div class="result"><span class="cls" id="cls" data-c="none">—</span><span class="pts" id="pts"></span></div>
  <div class="outs">
    <div class="out"><input id="outShort" readonly data-i18n-aria="ariaShort"><button class="btn" id="cpShort" type="button" data-i18n="copy">Copiar</button></div>
    <div class="out long"><input id="outLong" readonly data-i18n-aria="ariaLong"><button class="btn" id="cpLong" type="button" data-i18n="copy">Copiar</button></div>
  </div>
  <div class="quick"><input id="quick" data-i18n-ph="quickPh" data-i18n-aria="ariaQuick" autocomplete="off" spellcheck="false"></div>
  <input class="varin" id="variant" data-i18n-ph="variantPh" data-i18n-aria="ariaVariant" autocomplete="off">
  <div class="tools">
    <button class="btn" id="guideBtn" type="button" data-i18n="guide" data-i18n-title="guideTitle">Guía</button>
    <button class="btn" id="nrBtn" type="button" data-i18n="hideNr" data-i18n-title="hideNrTitle">Ocultar no rec.</button>
    <button class="btn" id="clear" type="button" data-i18n="clear">Limpiar</button>
    <span class="seg" role="group" aria-label="Idioma / Language"><button class="btn" type="button" data-lang="es">ES</button><button class="btn" type="button" data-lang="en">EN</button></span>
  </div>
</header>

<main class="grid" id="grid">
  <div class="col" id="c1"></div>
  <div class="col" id="c2"></div>
  <div class="col" id="c3"></div>
  <div class="col" id="c4">
    <section class="blk">
      <h3 data-i18n="tallyH">Recuento</h3>
      <div class="tally" id="tally"></div>
      <div class="scale" id="scale"></div>
      <div class="scale-n"><span>≤ −7</span><span data-i18n="scaleRef">puntos*, solo referencia</span><span>≥ 10</span></div>
      <ul class="warns" id="warns"></ul>
      <div class="flash" id="flash" role="status"></div>
    </section>
    <section class="blk">
      <h3 data-i18n="detailH">Detalle</h3>
      <div class="detail" id="detail"></div>
    </section>
    <section class="blk refs">
      <span data-i18n="refsPts"></span>
      Richards 2015 · Tavtigian 2018/2020 · Kelly 2018 (MYH7 VCEP) · Abou Tayoun 2018 (PVS1) · Brnich 2020 (PS3/BS3) · Pejaver 2022 (PP3/BP4) · Walker 2023 (splicing) · ClinGen SVI (PM2, PM3, PS2/PM6).
    </section>
  </div>
</main>

<script id="acmg-engine">
/* ENGINE START */
const ACMGEngine = (() => {
  let LANG = "es";
  const L = (es, en) => (LANG === "en" ? en : es);
  const setLang = (l) => { LANG = l === "en" ? "en" : "es"; };
  const getLang = () => LANG;
  const LEVELS = {
    VS: { pts: 8, chip: "VS", suf: "vst", long: "Very_Strong" },
    S:  { pts: 4, chip: "Str", suf: "str", long: "Strong" },
    M:  { pts: 2, chip: "Mod", suf: "mod", long: "Moderate" },
    P:  { pts: 1, chip: "Sup", suf: "sup", long: "Supporting" },
    SA: { pts: 0, chip: "SA", suf: "sa", long: "Stand_Alone" },
  };
  // Fuerza nativa por prefijo ACMG: el sufijo solo se escribe cuando la fuerza aplicada difiere de esta.
  const nativeOf = (code) => code.startsWith("PVS") ? "VS" : code.startsWith("PS") ? "S" : code.startsWith("PM") ? "M"
    : code.startsWith("PP") ? "P" : code.startsWith("BA") ? "SA" : code.startsWith("BS") ? "S" : code === "BP1_TTN" ? "SA" : "P";

  const C = (code, block, sub, levels, def, short, guide, nr) => ({ code, side: code[0] === "P" ? "P" : "B", block, sub, levels, def, short, guide, nr: nr || [] });
  const ALL = ["VS", "S", "M", "P"];
  const SMP = ["S", "M", "P"];
  const CRITERIA = [
    // ---- Población
    C("PM2", "pop", null, ["P"], "P", "Ausente / FAF < 0,00004 (grpmax)", "Ausente o extremadamente rara en población control (gnomAD, FAF grpmax < 0,00004 en la hoja local; umbral de la VCEP de miocardiopatías para MYH7). ClinGen SVI (2020): PM2 se aplica solo a nivel Supporting."),
    C("BS1", "pop", null, ["S", "P"], "S", "FAF > 0,0001 (grpmax)", "Frecuencia mayor de la esperada para la enfermedad. Umbral de la hoja local: FAF grpmax > 0,0001. El umbral depende de prevalencia, penetrancia y heterogeneidad (calcúlalo por gen si hace falta)."),
    C("BA1", "pop", null, ["SA"], "SA", "FAF > 0,001 (grpmax)", "Frecuencia alélica > 0,1 % (FAF grpmax) en población: benigna por sí sola. Ojo con fundadoras patogénicas conocidas (p. ej. TTR p.(Val142Ile)), que la ClinGen SVI excluye de BA1."),
    // ---- Casos / controles
    C("PS4", "cc", null, SMP, "S", "≥15 / ≥6 / ≥2 probandos o OR", "Prevalencia en afectados significativamente mayor que en controles. Por recuento de probandos (VCEP miocardiopatías, MYH7): Strong ≥ 15, Moderate ≥ 6, Supporting ≥ 2. Por caso-control: OR significativa (IC 95 % > 1) → Strong."),
    C("BS2", "cc", null, ["S", "P"], "S", "Observada en individuo sano adulto", "Observada en adulto sano en un trastorno de penetrancia completa a edad temprana. En miocardiopatías la penetrancia es incompleta y dependiente de la edad: no se recomienda."),
    // ---- Segregación
    C("PP1", "seg", null, SMP, "P", "≥7 / ≥5 / ≥3 meiosis", "Cosegregación con la enfermedad en varios familiares afectados. Strong ≥ 7 meiosis informativas, Moderate ≥ 5, Supporting ≥ 3 (VCEP miocardiopatías; equivalente a LOD ≈ 2,1 / 1,5 / 0,9)."),
    C("BS4", "seg", null, ["S", "P"], "S", "No segrega (≥2 afectados)", "Ausencia de segregación en afectados de la familia. Cuidado con fenocopias y con la penetrancia incompleta (un portador sano no es no-segregación)."),
    // ---- De novo
    C("PS2", "dn", null, ALL, "S", "De novo, paternidad confirmada", "De novo con maternidad y paternidad confirmadas, en paciente con la enfermedad y sin historia familiar. La fuerza sale de los puntos de la ClinGen SVI (v1.1) según el número de casos y la especificidad del fenotipo."),
    C("PM6", "dn", null, ALL, "M", "De novo asumida (sin confirmar)", "De novo asumida, sin confirmar maternidad ni paternidad. Misma escala de puntos SVI que PS2; un mismo caso se cuenta por PS2 o por PM6, no por los dos."),
    // ---- Tipo de variante
    C("PVS1", "tipo", "Truncante / null", ALL, "VS", "Null en gen con LoF como mecanismo", "Variante nula (nonsense, frameshift, ±1/2 de splicing, codón de inicio, deleción multiexónica) en un gen donde la LoF es mecanismo de enfermedad. La fuerza sale del árbol de Abou Tayoun 2018 (NMD, último exón, región crítica, exón en isoforma relevante). Datos de ARN que muestran transcrito LoF: PVS1 con su fuerza (Walker 2023)."),
    C("PS1", "tipo", "Missense", SMP, "S", "Mismo AA que una P establecida", "Mismo cambio de aminoácido que una variante patogénica establecida, por otro cambio de nucleótido. Walker 2023 la extiende a splicing: variante con el mismo efecto previsto sobre el splicing que una P conocida (en la misma posición). Nunca junto a PVS1."),
    C("PM5", "tipo", "Missense", SMP, "M", "Otro AA en residuo con P conocida", "Missense nueva en un residuo donde otra missense es patogénica. Supporting si la de referencia solo es LP o el cambio es menos grave según Grantham."),
    C("PP2", "tipo", "Missense", ["P"], "P", "Missense en gen con poca missense benigna", "Missense en un gen con baja tasa de missense benigna y en el que la missense es mecanismo frecuente de enfermedad.", ["P"]),
    C("BP1", "tipo", "Missense", ["P"], "P", "Missense en gen de mecanismo truncante", "Missense en un gen en el que solo las truncantes causan la enfermedad."),
    C("BP1_TTN", "tipo", "Missense", ["SA"], "SA", "Missense en TTN (regla local)", "Regla del laboratorio: una missense en TTN no explica una miocardiopatía y es benigna por sí sola (stand-alone). No es criterio ACMG publicado: en el informe se cita como regla local."),
    C("PM1", "tipo", "Hot-spot / dominio", SMP, "M", "Hot-spot o dominio sin benignas", "En hot-spot mutacional o dominio funcional crítico sin variación benigna. Con PP3, la suma PM1 + PP3 no pasa de Strong, 4 puntos (Pejaver 2022)."),
    C("PM4", "tipo", "Indel / stop-loss", ["M", "P"], "M", "Indel en marco o stop-loss, no repetitiva", "Cambia la longitud de la proteína: deleción o inserción en marco fuera de una región repetitiva, o pérdida del codón de parada."),
    C("BP3", "tipo", "Indel / stop-loss", ["P"], "P", "Indel en marco en región repetitiva", "Deleción o inserción en marco en región repetitiva sin función conocida.", ["P"]),
    C("BP7", "tipo", "Sinónima / intrónica", ["P"], "P", "Sinónima sin efecto en splicing", "Sinónima (o intrónica fuera de +7/−21, Walker 2023) sin efecto previsto en el splicing y en un nucleótido no muy conservado. Walker 2023 permite usarla también con ARN que no muestra efecto. No se combina con BP4: es la misma predicción."),
    C("PM3", "tipo", "Recesiva", ALL, "M", "En trans con P (recesiva)", "Recesiva: detectada en trans con una variante patogénica. La fuerza sale de los puntos de la ClinGen SVI para PM3 (fase confirmada, clase de la otra variante, homocigotos)."),
    // ---- Funcional
    C("PS3", "fun", null, SMP, "S", "Ensayo funcional bien establecido: daña", "Estudio funcional bien establecido que muestra efecto deletéreo. La fuerza sale de la OddsPath calibrada del ensayo (Brnich 2020): Strong ≥ 18,7, Moderate ≥ 4,3, Supporting ≥ 2,1."),
    C("BS3", "fun", null, SMP, "S", "Ensayo funcional bien establecido: normal", "Estudio funcional bien establecido sin efecto deletéreo. La fuerza sale de la OddsPath (Brnich 2020): Strong ≤ 0,053, Moderate ≤ 0,23, Supporting ≤ 0,48."),
    // ---- Predictores
    C("PP3", "pred", null, SMP, "P", "Predictores: deletéreo", "Evidencia computacional de efecto deletéreo. REVEL (Pejaver 2022): Supporting ≥ 0,644, Moderate ≥ 0,773, Strong ≥ 0,932. Splicing: SpliceAI ≥ 0,2 (Walker 2023). En cardio la hoja local usa solo Supporting. No se combina con PVS1 por la misma evidencia.", ["S", "M"]),
    C("BP4", "pred", null, SMP, "P", "Predictores: benigno", "Evidencia computacional de ausencia de efecto. REVEL (Pejaver 2022): Supporting ≤ 0,290, Moderate ≤ 0,183, Strong ≤ 0,016. Splicing: SpliceAI ≤ 0,1 (Walker 2023). En cardio la hoja local usa solo Supporting.", ["S", "M"]),
    // ---- Otros
    C("PP4", "otros", null, ["P"], "P", "Fenotipo muy específico", "Fenotipo o historia familiar muy específicos de una enfermedad con una sola etiología genética. Las miocardiopatías son genéticamente heterogéneas: no se recomienda.", ["P"]),
    C("PP5", "otros", null, ["P"], "P", "Fuente reputada: patogénica", "Fuente reputada que la da por patogénica sin aportar la evidencia. Retirado por la ClinGen SVI (Biesecker 2018): se usa la evidencia primaria.", ["P"]),
    C("BP6", "otros", null, ["P"], "P", "Fuente reputada: benigna", "Fuente reputada que la da por benigna sin aportar la evidencia. Retirado por la ClinGen SVI (Biesecker 2018).", ["P"]),
    C("BP2", "otros", null, ["P"], "P", "En trans con P (AD) / en cis con P", "En trans con una patogénica en un gen dominante de penetrancia completa, o en cis con una patogénica en cualquier herencia. En cardio hay dobles portadores con fenotipo más grave: no se recomienda.", ["P"]),
    C("BP5", "otros", null, ["P"], "P", "Caso con otra explicación molecular", "En un caso con otra causa molecular. En cardio la enfermedad puede ser oligogénica y dosis-dependiente: no se recomienda.", ["P"]),
  ];

    const toks = s.slice(2).split("-").map((t) => { const m = t.match(/^(BP1TTN|PVS1|PS[1-4]|PM[1-6]|PP[1-5]|BA1|BS[1-4]|BP[1-7])(vst|str|mod|sup|sa)?$/i); if (!m) return t; const code = m[1].toUpperCase().replace("BP1TTN", "BP1_TTN"); return m[2] ? `${code}_${m[2]}` : code; });
    return parse(toks.join(" ")).state;
  }

  return { LEVELS, CRITERIA, BY, ORDER, CLASSES, RULES, EN, nativeOf, conflict, blockers, select, toggle, score, label, format, parse, toHash, fromHash, setLang, getLang, text, subText };
})();
if (typeof module !== "undefined") module.exports = ACMGEngine;
/* ENGINE END */
</script>

<script>
(() => {
  const E = ACMGEngine;
  const $ = (id) => document.getElementById(id);
  let state = {};
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  // Textos de la interfaz. Los de los criterios, avisos y bloqueos viven en el motor (E.text, E.setLang).
  const UI = {
    es: { copy: "Copiar", copied: "Copiado", guide: "Guía", guideTitle: "Muestra la explicación de cada criterio", hideNr: "Ocultar no rec.",
      hideNrTitle: "Oculta los no recomendados en cardio", clear: "Limpiar", tallyH: "Recuento", detailH: "Detalle",
      quickPh: "Teclea: pvs1 pm2_sup ps3_mod … ↵  ( / para venir aquí)", variantPh: "Variante (opcional): gen · hg38 · c. · p.",
      ariaShort: "Resultado corto para copiar", ariaLong: "Resultado largo para copiar", ariaQuick: "Entrada rápida de criterios", ariaVariant: "Variante",
      outPh: "Marca criterios: aquí sale p. ej. LP (PVS1, PM2_sup)", ptsRef: "pts*", scaleRef: "puntos*, solo referencia", nr: " · no rec. cardio", path: "Pat.", ben: "Ben.",
      mark: (c) => `Marcar ${c} con su fuerza por defecto`, blocked: (b, why) => `Bloqueado por ${b}: ${why}`, info: (c) => `Detalle de ${c}`,
      strengths: "Fuerzas", def: " (por defecto)", nrLong: " — no rec. cardio", notWith: "No va con", prefilled: "Prellenado",
      selectText: "Selecciona el texto y cópialo con Ctrl+C",
      refsPts: "La clase sale de las reglas de combinación de Richards 2015 (Tabla 5) más la de ClinGen SVI PM2 v1.0 (2020): 1 Very Strong + 1 Supporting = LP. Si benigna y patogénica llegan a clase a la vez: VUS (nota de la Tabla 5). Hot-VUS = VUS con ≥ 4 puntos. *Puntos de Tavtigian 2020 (VS 8 · S 4 · M 2 · Sup 1; benignas −4 / −2 / −1), solo de referencia: si dan otra clase, sale un aviso.",
      hint: `<p class="hint">Pulsa <b>?</b> en un criterio para ver su definición, umbrales y referencia. Pulsa el código para marcarlo con su fuerza por defecto (borde marcado), o elige otra fuerza en sus botones.</p><p class="hint">Atajos: <kbd>/</kbd> entrada rápida · <kbd>Esc</kbd> sale · <kbd>Alt</kbd>+<kbd>C</kbd> copia la línea corta · <kbd>Alt</kbd>+<kbd>L</kbd> limpia.</p>`,
      blocks: { pop: "Población", cc: "Casos / controles", seg: "Segregación", dn: "De novo", tipo: "Tipo de variante", fun: "Funcional", pred: "Predictores (solo Supporting en cardio)", otros: "Otros" } },
    en: { copy: "Copy", copied: "Copied", guide: "Guide", guideTitle: "Show each criterion's explanation", hideNr: "Hide not rec.",
      hideNrTitle: "Hide criteria not recommended in cardio", clear: "Clear", tallyH: "Tally", detailH: "Detail",
      quickPh: "Type: pvs1 pm2_sup ps3_mod … ↵  ( / to jump here)", variantPh: "Variant (optional): gene · hg38 · c. · p.",
      ariaShort: "Short result to copy", ariaLong: "Long result to copy", ariaQuick: "Quick criteria entry", ariaVariant: "Variant",
      outPh: "Pick criteria: e.g. LP (PVS1, PM2_sup) appears here", ptsRef: "pts*", scaleRef: "points*, reference only", nr: " · not rec. cardio", path: "Path.", ben: "Ben.",
      mark: (c) => `Apply ${c} at its default strength`, blocked: (b, why) => `Blocked by ${b}: ${why}`, info: (c) => `Details of ${c}`,
      strengths: "Strengths", def: " (default)", nrLong: " — not rec. in cardio", notWith: "Not combinable with", prefilled: "Prefilled",
      selectText: "Select the text and copy it with Ctrl+C",
      refsPts: "The class comes from the Richards 2015 combining rules (Table 5) plus ClinGen SVI PM2 v1.0 (2020): 1 Very Strong + 1 Supporting = LP. If benign and pathogenic both reach a class: VUS (Table 5 footnote). Hot-VUS = VUS with ≥ 4 points. *Tavtigian 2020 points (VS 8 · S 4 · M 2 · Sup 1; benign −4 / −2 / −1), reference only: if they give another class, a warning appears.",
      hint: `<p class="hint">Press <b>?</b> on a criterion to see its definition, thresholds and reference. Press the code to apply it at its default strength (outlined), or pick another strength with its buttons.</p><p class="hint">Shortcuts: <kbd>/</kbd> quick entry · <kbd>Esc</kbd> leave · <kbd>Alt</kbd>+<kbd>C</kbd> copy the short line · <kbd>Alt</kbd>+<kbd>L</kbd> clear.</p>`,
      blocks: { pop: "Population", cc: "Case-control", seg: "Segregation", dn: "De novo", tipo: "Variant type", fun: "Functional", pred: "Predictors (Supporting only in cardio)", otros: "Other" } },
  };
  let lang = store.get("acmg.lang") || ((navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en");
  const T = () => UI[lang];

  const BLOCKS = [["c1", "pop"], ["c1", "cc"], ["c1", "seg"], ["c1", "dn"], ["c2", "tipo"], ["c3", "fun"], ["c3", "pred"], ["c3", "otros"]];
  const rows = {}, heads = [];
  for (const [col, id] of BLOCKS) {
    const sec = document.createElement("section"); sec.className = "blk";
    const h3 = document.createElement("h3"); h3.dataset.block = id; sec.appendChild(h3);
    let sub = null;
    for (const c of E.CRITERIA.filter((x) => x.block === id)) {
      if (c.sub && c.sub !== sub) { sub = c.sub; const h = document.createElement("h4"); h.dataset.sub = c.code; sec.appendChild(h); heads.push(h); }
      const r = document.createElement("div"); r.className = "crit" + (c.nr.length === c.levels.length ? " nr" : ""); r.dataset.code = c.code;
      const b = c.side === "B" ? " b" : "";
      r.innerHTML = `<button class="code${b}" type="button">${c.code}</button>`
        + `<span class="lbl"></span>`
        + `<span class="chips">${c.levels.map((l) => `<button type="button" class="chip${b}${l === c.def ? " def" : ""}${c.nr.includes(l) ? " nr" : ""}" data-l="${l}">${E.LEVELS[l].chip}</button>`).join("")}</span>`
        + `<button class="info" type="button">?</button>`
        + `<div class="guide"></div>`;
      sec.appendChild(r); rows[c.code] = r;
    }
    $(col).appendChild(sec);
  }
  let shown = null; // criterio en el panel de detalle

  function applyLang() {
    E.setLang(lang);
    document.documentElement.lang = lang;
    document.documentElement.style.setProperty("--nr-txt", JSON.stringify(T().nr));
    for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = T()[el.dataset.i18n];
    for (const el of document.querySelectorAll("[data-i18n-ph]")) el.placeholder = T()[el.dataset.i18nPh];
    for (const el of document.querySelectorAll("[data-i18n-title]")) el.title = T()[el.dataset.i18nTitle];
    for (const el of document.querySelectorAll("[data-i18n-aria]")) el.setAttribute("aria-label", T()[el.dataset.i18nAria]);
    for (const el of document.querySelectorAll("[data-block]")) el.textContent = T().blocks[el.dataset.block];
    for (const h of heads) h.textContent = E.subText(E.BY[h.dataset.sub]);
    for (const c of E.CRITERIA) {
      const r = rows[c.code];
      r.querySelector(".lbl").textContent = E.text(c, "short");
      r.querySelector(".guide").textContent = E.text(c, "guide");
      r.querySelector(".info").setAttribute("aria-label", T().info(c.code));
    }
    for (const b of document.querySelectorAll("[data-lang]")) b.classList.toggle("on", b.dataset.lang === lang);
    if (shown) showDetail(shown); else $("detail").innerHTML = T().hint;
    flash("");
    render();
  }

  function flash(msg) { $("flash").textContent = msg || ""; }
  function set(next) { state = next; render(); }

  document.addEventListener("click", (ev) => {
    const r = ev.target.closest(".crit"); if (!r) return;
    const code = r.dataset.code;
    if (ev.target.closest(".info")) { showDetail(code); return; }
    let l = null;
    const chip = ev.target.closest(".chip"); if (chip) { if (chip.disabled) return; l = chip.dataset.l; }
    else if (!ev.target.closest(".code")) return;
    try { set(E.toggle(state, code, l)); flash(""); } catch (e) { flash(e.message); }
  });

  function showDetail(code) {
    const c = E.BY[code], t = T(); shown = code;
    const conf = E.CRITERIA.filter((x) => x.code !== code && E.conflict(code, x.code)).map((x) => x.code);
    const esc = (x) => String(x).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
    $("detail").innerHTML = `<p><b class="c">${c.code}</b> · ${E.text(c, "short")}</p><p>${E.text(c, "guide")}</p>`
      + `<p class="meta">${t.strengths}: ${c.levels.map((l) => E.label(c.code, l, "long") + (l === c.def ? t.def : "") + (c.nr.includes(l) ? t.nrLong : "")).join(" · ")}</p>`
      + (conf.length ? `<p class="meta">${t.notWith}: ${conf.join(", ")}</p>` : "")
      + (state[code] && state[code].src ? `<p class="meta">${t.prefilled}: ${esc(state[code].src)}</p>` : "");
  }

  function render() {
    for (const c of E.CRITERIA) {
      const r = rows[c.code], sel = state[c.code];
      const bl = sel ? [] : E.blockers(state, c.code);
      r.classList.toggle("blocked", bl.length > 0);
      r.classList.toggle("auto", !!(sel && sel.src));
      r.querySelector(".code").disabled = bl.length > 0;
      r.querySelector(".code").title = bl.length ? T().blocked(bl.map((x) => x.code).join(", "), bl[0].why) : T().mark(c.code);
      for (const ch of r.querySelectorAll(".chip")) {
        ch.classList.toggle("sel", !!(sel && sel.l === ch.dataset.l));
        ch.disabled = bl.length > 0;
        ch.setAttribute("aria-pressed", sel && sel.l === ch.dataset.l ? "true" : "false");
        if (bl.length) ch.title = T().blocked(bl.map((x) => x.code).join(", "), bl[0].why);
        else ch.title = `${E.label(c.code, ch.dataset.l, "long")} (${ch.dataset.l === "SA" ? "stand-alone" : (c.side === "P" ? "+" : "−") + E.LEVELS[ch.dataset.l].pts})`;
      }
    }
    const s = E.score(state);
    $("cls").dataset.c = s.n ? s.cls.id : "none";
    $("cls").textContent = s.n ? s.cls.short : "—";
    $("pts").textContent = s.n ? s.ruleText : "";
    $("pts").title = `Tavtigian 2020: ${s.total > 0 ? "+" : ""}${s.total} pts → ${s.ptsCls.short}`;
    const variant = $("variant").value;
    $("outShort").value = s.n ? E.format(state, { variant }) : "";
    $("outShort").placeholder = T().outPh;
    $("outLong").value = s.n ? E.format(state, { style: "long", variant }) : "";
    const cP = s.counts.P, cB = s.counts.B;
    $("tally").innerHTML = `<span></span><span class="h">VS/SA</span><span class="h">Str</span><span class="h">Mod</span><span class="h">Sup</span><span class="h tot">${T().ptsRef}</span>`
      + `<span class="h">${T().path}</span><span>${cP.VS}</span><span>${cP.S}</span><span>${cP.M}</span><span>${cP.P}</span><span class="tot">+${s.pPts}</span>`
      + `<span class="h">${T().ben}</span><span>${cB.SA}</span><span>${cB.S}</span><span>${cB.M}</span><span>${cB.P}</span><span class="tot">${s.bPts}</span>`;
    const segs = [["B", -10, -7, "var(--bsa)", "var(--bsa-fg)"], ["LB", -6, -1, "var(--bmo)", "var(--bmo-fg)"], ["VUS", 0, 3, "var(--off)", "var(--fg)"], ["Hot", 4, 5, "var(--mo)", "var(--mo-fg)"], ["LP", 6, 9, "#d9822b", "#fff"], ["P", 10, 12, "var(--bad)", "#fff"]];
    const span = 23; // -10 … 12
    const v = s.standalone.length ? -10 : Math.max(-10, Math.min(12, s.total));
    $("scale").innerHTML = segs.map(([t, a, b, bg, fg]) => `<span style="flex:${b - a + 1};background:${bg};color:${fg}">${t}</span>`).join("")
      + `<i class="mk" style="left:calc(${((v + 10 + 0.5) / span) * 100}% - 1.5px)"></i>`;
    $("warns").innerHTML = s.warns.map((w) => `<li class="${w.bad ? "bad" : ""}">${w.t}</li>`).join("");
    applyNr();
    try { const h = E.toHash(state); history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (e) {}
  }

  function copy(id, btn) {
    const el = $(id); if (!el.value) return;
    const done = () => { btn.textContent = T().copied; setTimeout(() => (btn.textContent = T().copy), 900); };
    const fallback = () => { el.focus(); el.select(); try { document.execCommand("copy"); done(); } catch (e) { flash(T().selectText); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.value).then(done, fallback); else fallback();
  }
  $("cpShort").onclick = () => copy("outShort", $("cpShort"));
  $("cpLong").onclick = () => copy("outLong", $("cpLong"));
  for (const id of ["outShort", "outLong"]) $(id).addEventListener("focus", (e) => e.target.select());
  for (const b of document.querySelectorAll("[data-lang]")) b.onclick = () => { lang = b.dataset.lang; store.set("acmg.lang", lang); applyLang(); };
  $("clear").onclick = () => { set({}); flash(""); };
  $("variant").addEventListener("input", render);

  const quick = $("quick");
  quick.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const r = E.parse(quick.value, state);
      set(r.state);
      quick.classList.toggle("err", r.errors.length > 0);
      flash(r.errors.join(" · "));
      if (!r.errors.length) quick.value = "";
    } else if (e.key === "Escape") { quick.blur(); }
  });
  document.addEventListener("keydown", (e) => {
    const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing) { e.preventDefault(); quick.focus(); }
    else if (e.altKey && (e.key === "c" || e.key === "C")) { e.preventDefault(); copy("outShort", $("cpShort")); }
    else if (e.altKey && (e.key === "l" || e.key === "L")) { e.preventDefault(); set({}); }
  });

  const toggleClass = (btn, cls, key) => { const on = document.body.classList.toggle(cls); btn.classList.toggle("on", on); store.set(key, on ? "1" : "0"); };
  $("guideBtn").onclick = () => toggleClass($("guideBtn"), "g", "acmg.guide");
  $("nrBtn").onclick = () => { const on = !$("nrBtn").classList.contains("on"); $("nrBtn").classList.toggle("on", on); store.set("acmg.hidenr", on ? "1" : "0"); applyNr(); };
  function applyNr() { const on = $("nrBtn").classList.contains("on"); for (const c of E.CRITERIA) if (c.nr.length === c.levels.length) rows[c.code].hidden = on && !state[c.code]; }
  if (store.get("acmg.guide") === "1") { document.body.classList.add("g"); $("guideBtn").classList.add("on"); }
  if (store.get("acmg.hidenr") === "1") { $("nrBtn").classList.add("on"); }

  // Fase 2: una herramienta externa prellena con window.ACMG.prefill({PM2: {l: "P", src: "gnomAD FAF 0,00001"}}, "MYH7 c.1208G>A p.(Arg403Gln)")
  // o con postMessage({type: "acmg:prefill", criteria: {...}, variant: "..."}).
  function prefill(crit, variant) {
    let s = {};
    for (const [k, v] of Object.entries(crit || {})) { try { s = E.select(s, k, v && v.l, v && v.src); } catch (e) { flash(e.message); } }
    if (variant != null) $("variant").value = variant;
    set(s);
  }
  window.ACMG = { prefill, get: () => JSON.parse(JSON.stringify(state)), engine: E };
  window.addEventListener("message", (ev) => { const d = ev.data; if (d && d.type === "acmg:prefill") prefill(d.criteria, d.variant); });

  state = E.fromHash(location.hash);
  if (!Object.keys(state).length) state = E.parse("PVS1 PM2").state; // ejemplo al abrir: LP (PVS1, PM2_sup)
  applyLang();
})();
</script>
